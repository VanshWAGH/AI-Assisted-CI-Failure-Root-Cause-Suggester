# Docker profile — overrides applied when SPRING_PROFILES_ACTIVE=docker
# All secrets come from environment variables injected by Docker Compose / Render.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rootcause}
    username: ${SPRING_DATASOURCE_USERNAME:rootcause}
    password: ${SPRING_DATASOURCE_PASSWORD:rootcause_secret}

  jpa:
    show-sql: false

logging:
  level:
    com.rootcause: INFO
    org.hibernate.SQL: WARN

rootcause:
  gitlab:
    webhook-secret: ${GITLAB_WEBHOOK_SECRET:change-me}
    private-token: ${GITLAB_PRIVATE_TOKEN:}
  api:
    keys: ${ROOTCAUSE_API_KEYS:}

# CORS: comma-separated list of allowed origins.
# In production set CORS_ALLOWED_ORIGINS to your Vercel URL, e.g.:
#   https://rootcause-suggester.vercel.app
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001,http://localhost:3000}

