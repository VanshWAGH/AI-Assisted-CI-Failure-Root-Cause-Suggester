# Docker profile — overrides applied when SPRING_PROFILES_ACTIVE=docker
# All secrets injected by Docker Compose or Render Blueprint.
#
# ── Neon: ONE connection string ──────────────────────────────────────────────
# In Render Blueprint you only need to paste ONE value: DATABASE_URL
#
# Where to get it:
#   neon.tech → your project → Dashboard → Connection Details
#   → Change format dropdown to "JDBC" → Copy the string. It looks like:
#
#   jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=abc123&sslmode=require
#
# The JDBC URL already contains user + password as query params.
# We do NOT set spring.datasource.username / password here so that
# HikariCP reads them directly from the URL — no extra vars needed!
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    # Paste the full Neon JDBC URL (with ?user=...&password=...&sslmode=require)
    # Local Docker fallback uses the docker-compose postgres service.
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/rootcause}
    # username / password intentionally omitted — read from URL query params.
    # Docker Compose local fallback: override via SPRING_DATASOURCE_USERNAME/PASSWORD.
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Allow Neon serverless to wake up on cold start
      connection-timeout: 60000
      initialization-fail-timeout: 120000

  jpa:
    show-sql: false

logging:
  level:
    com.rootcause: INFO
    org.hibernate.SQL: WARN

rootcause:
  gitlab:
    webhook-secret: ${GITLAB_WEBHOOK_SECRET:change-me}
    private-token: ${GITLAB_PRIVATE_TOKEN:}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:change-me}
    token: ${GITHUB_TOKEN:}
  api:
    keys: ${ROOTCAUSE_API_KEYS:}

# CORS — set CORS_ALLOWED_ORIGINS to your Netlify URL after frontend deploy.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001,http://localhost:3000}
