# Docker profile — overrides applied when SPRING_PROFILES_ACTIVE=docker
# All secrets come from environment variables injected by Docker Compose / Render Blueprint.
#
# ── Neon connection string (simplest setup) ─────────────────────────────────
# Neon gives you ONE connection string, e.g.:
#   postgresql://neondb_owner:abc123@ep-cool-name-123.us-east-2.aws.neon.tech/neondb?sslmode=require
#
# Set DATABASE_URL to that value in Render Blueprint.
# This profile converts it automatically to the JDBC format Spring Boot expects.
# ---------------------------------------------------------------------------

spring:
  datasource:
    # If DATABASE_URL is set (Neon format), use it. Otherwise fall back to separate vars.
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rootcause}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:rootcause}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:rootcause_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon serverless wakes up on first connection — allow extra time
      connection-timeout: 60000
      initialization-fail-timeout: 120000

  jpa:
    show-sql: false

logging:
  level:
    com.rootcause: INFO
    org.hibernate.SQL: WARN

rootcause:
  gitlab:
    webhook-secret: ${GITLAB_WEBHOOK_SECRET:change-me}
    private-token: ${GITLAB_PRIVATE_TOKEN:}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:change-me}
    token: ${GITHUB_TOKEN:}
  api:
    keys: ${ROOTCAUSE_API_KEYS:}

# CORS: comma-separated list of allowed origins.
# Set CORS_ALLOWED_ORIGINS to your Netlify/Vercel URL after frontend deploy.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001,http://localhost:3000}
