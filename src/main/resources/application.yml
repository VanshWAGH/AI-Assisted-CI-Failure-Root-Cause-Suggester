server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rootcause-suggester

  datasource:
    url: jdbc:postgresql://localhost:5432/rootcause
    username: rootcause
    password: rootcause_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Actuator / Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: rootcause-suggester
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: when_authorized

# App-specific config
rootcause:
  classifier:
    default-mode: RULE_BASED   # RULE_BASED | ML_ONNX | HYBRID
    onnx:
      model-path: models/log-classifier.onnx
      enabled: false
  gitlab:
    api-url: https://gitlab.com/api/v4
    webhook-secret: ${GITLAB_WEBHOOK_SECRET:change-me}
    private-token: ${GITLAB_PRIVATE_TOKEN:}
  jenkins:
    base-url: ${JENKINS_BASE_URL:http://localhost:8081}
    username: ${JENKINS_USERNAME:}
    api-token: ${JENKINS_API_TOKEN:}

# Logging
logging:
  level:
    com.rootcause: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
