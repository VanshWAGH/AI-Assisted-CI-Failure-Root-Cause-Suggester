# ============================================================
#  render.yaml  —  Render.com Blueprint
#  AI-Assisted CI-Failure Root-Cause Suggester
# ============================================================
#
#  ONE-CLICK DEPLOY STEPS:
#
#  1. Get your Neon connection string (ONE string, takes 2 min):
#       a) Sign up at https://neon.tech (free, no credit card)
#       b) Create a project → Dashboard → Connection Details
#       c) Change the format dropdown from "psql" to "JDBC"
#       d) Copy the string — it looks like:
#          jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=abc123&sslmode=require
#
#  2. Deploy via Blueprint (takes 5 min):
#       a) Go to https://dashboard.render.com/blueprints
#       b) Click "New Blueprint Instance"
#       c) Connect repo: VanshWAGH/AI-Assisted-CI-Failure-Root-Cause-Suggester
#       d) Render shows 2 prompts — paste your values:
#             DATABASE_URL      →  (paste the Neon JDBC string from step 1)
#             ROOTCAUSE_API_KEYS → rca_92d6c92615c849759e0cc8523e8fc567
#       e) Click "Apply" — Render builds & deploys automatically (~5 min)
#
#  3. Deploy frontend to Netlify (1 min — drag & drop):
#       a) Run: cd frontend && npm run build
#       b) Go to https://app.netlify.com/drop
#       c) Drag the frontend/dist folder → live instantly!
# ============================================================

services:

  # ── Spring Boot API ────────────────────────────────────────
  - type: web
    name: rootcause-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free                     # Free tier (sleeps after 15 min idle)
    region: oregon

    healthCheckPath: /actuator/health/readiness

    envVars:

      # ── Spring profile ───────────────────────────────────
      - key: SPRING_PROFILES_ACTIVE
        value: docker

      # ── Neon connection string ───────────────────────────
      # Paste the JDBC format URL from neon.tech:
      # Dashboard → Connection Details → format: JDBC
      # jdbc:postgresql://ep-xxx.aws.neon.tech/neondb?user=xxx&password=xxx&sslmode=require
      - key: DATABASE_URL
        sync: false          # ← Render will prompt you to enter this

      # ── API key for X-API-Key authentication ─────────────
      - key: ROOTCAUSE_API_KEYS
        sync: false          # ← e.g. rca_92d6c92615c849759e0cc8523e8fc567

      # ── CORS (update to your Netlify URL after deploy) ───
      # After frontend is on Netlify, change this to:
      #   https://your-site-name.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

      # ── Optional CI integrations (leave blank if unused) ─
      - key: GITLAB_WEBHOOK_SECRET
        value: ""
      - key: GITLAB_PRIVATE_TOKEN
        value: ""
      - key: GITHUB_WEBHOOK_SECRET
        value: ""
      - key: GITHUB_TOKEN
        value: ""
      - key: JENKINS_WEBHOOK_SECRET
        value: ""
