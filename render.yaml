# ============================================================
#  render.yaml  —  Render.com Blueprint
#  AI-Assisted CI-Failure Root-Cause Suggester
# ============================================================
#
#  ONE-CLICK DEPLOY:
#  1. Go to https://dashboard.render.com/blueprints
#  2. Click "New Blueprint Instance"
#  3. Connect your GitHub repo → Render reads this file
#  4. Fill in the 4 secret values Render asks for (marked sync:false below)
#  5. Click "Apply" — Render builds and deploys automatically
#
#  DATABASE (Neon — free forever):
#  Before clicking Apply:
#   a) Create free account at https://neon.tech
#   b) Create a project → go to Dashboard → Connection Details
#   c) Switch format to "JDBC" → copy the connection string:
#      jdbc:postgresql://ep-xxx.region.aws.neon.tech/neondb?sslmode=require
#   d) Also copy the Username and Password shown below the URL
# ============================================================

services:

  # ── Spring Boot API ────────────────────────────────────────
  - type: web
    name: rootcause-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free                     # Free tier — sleeps after 15 min idle

    region: oregon                 # Options: oregon, frankfurt, singapore, ohio

    healthCheckPath: /actuator/health/readiness

    # Autoscaling is not available on free tier
    scaling:
      minInstances: 1
      maxInstances: 1
      targetMemoryPercent: 80
      targetCPUPercent: 80

    envVars:

      # ── Spring profile ───────────────────────────────────
      - key: SPRING_PROFILES_ACTIVE
        value: docker

      # ── Neon PostgreSQL (REQUIRED — paste from neon.tech) ─
      #
      # From Neon Dashboard → Connection Details → select "JDBC" format:
      #   jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false     # ← Render will prompt you to enter this during Blueprint setup

      # From Neon Dashboard → Connection Details → Username field
      - key: DB_USERNAME
        sync: false     # ← e.g. "neondb_owner"

      # From Neon Dashboard → Connection Details → Password field
      - key: DB_PASSWORD
        sync: false     # ← your Neon DB password

      # ── API Key auth ─────────────────────────────────────
      # Used as X-API-Key header in all API calls.
      # Generate one: openssl rand -hex 16 → prefix with "rca_"
      - key: ROOTCAUSE_API_KEYS
        sync: false     # ← e.g. "rca_92d6c92615c849759e0cc8523e8fc567"

      # ── CORS (update after frontend deploy) ──────────────
      # After deploying to Netlify, update this value to your Netlify URL:
      #   https://rootcause-suggester.netlify.app
      # You can set it now and redeploy, or update it in the Render dashboard later.
      - key: CORS_ALLOWED_ORIGINS
        value: "*"      # Permissive default; tighten to your Netlify URL after deploy

      # ── Optional: CI integrations ─────────────────────────
      - key: GITLAB_WEBHOOK_SECRET
        value: change-me-in-dashboard
      - key: GITLAB_PRIVATE_TOKEN
        value: ""

      - key: GITHUB_WEBHOOK_SECRET
        value: change-me-in-dashboard
      - key: GITHUB_TOKEN
        value: ""

      - key: JENKINS_WEBHOOK_SECRET
        value: ""
