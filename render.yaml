# render.yaml — Render.com Infrastructure-as-Code
# Deploys the Spring Boot API as a Docker-based web service (free tier).
#
# SETUP STEPS:
# 1. Create a free account at https://render.com
# 2. Connect your GitHub repo
# 3. Render will auto-detect this file and create the service
# 4. Set the environment variables listed below in the Render dashboard
#    (or they will use the defaults shown here)

services:
  - type: web
    name: rootcause-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    # Free instance — spins down after 15 min of inactivity
    plan: free
    region: oregon

    healthCheckPath: /actuator/health/readiness

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker

      # --- Database (Neon PostgreSQL) ---
      # Set SPRING_DATASOURCE_URL in Render dashboard after creating your Neon DB.
      # Format: jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false   # must be set manually in Render dashboard

      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # set in dashboard (e.g. "neondb_owner")

      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # set in dashboard (your Neon DB password)

      # --- Security ---
      # Comma-separated API keys for X-API-Key authentication.
      # Generate with: openssl rand -hex 16 | xargs echo "rca_"
      - key: ROOTCAUSE_API_KEYS
        sync: false   # set in dashboard

      # --- CORS ---
      # After deploying frontend to Vercel, set this to your Vercel URL.
      # e.g. https://rootcause-suggester.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: "https://localhost:3001"   # update after Vercel deploy

      # --- Optional integrations ---
      - key: GITLAB_WEBHOOK_SECRET
        value: change-me
      - key: GITLAB_PRIVATE_TOKEN
        value: ""
      - key: GITHUB_WEBHOOK_SECRET
        value: change-me
      - key: GITHUB_TOKEN
        value: ""
      - key: JENKINS_WEBHOOK_SECRET
        value: ""
