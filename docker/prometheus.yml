global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rootcause-suggester'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8080']
        labels:
          application: 'rootcause-suggester'
          environment: 'docker'
